name: Security & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan-filesystem-and-iac:
    name: Trivy IaC & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy on Terraform Infrastructure Configuration
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "infrastructure"
          format: "sarif"
          output: "trivy-iac-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy on Kubernetes Manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "k8s"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Filesystem SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

      - name: Upload IaC SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-iac-results.sarif"
          category: "trivy-iac"
