apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-inference-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: ml-inference-prod
    app.kubernetes.io/part-of: ml-inference-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ml-platform-project

  source:
    repoURL: "https://github.com/ragibcs/ml-inference-platform.git"
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: "https://kubernetes.default.svc"
    namespace: ml-platform-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
