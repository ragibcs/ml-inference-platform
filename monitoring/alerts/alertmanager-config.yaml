global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

inhibit_rules:
  # Inhibit HighRequestLatency if HighCPUUsage is already firing on the same pod
  - source_match:
      alertname: 'HighCPUUsage'
    target_match:
      alertname: 'HighRequestLatency'
    equal: ['pod']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://notification-service.monitoring.svc.cluster.local:5000/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://pagerduty-bridge.monitoring.svc.cluster.local:8080/critical'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://slack-bridge.monitoring.svc.cluster.local:8080/warnings'
        send_resolved: true
